<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuber - Watch Videos</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --secondary-bg: #1a1a1a;
      --tertiary-bg: #212121;
      --text: #f1f1f1;
      --secondary-text: #a0a0a0;
      --border: #303030;
      --accent: #ff0000;
      --hover: #272727;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
    }

    body {
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--secondary-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 32px;
      min-width: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 24px;
      font-weight: 700;
      text-decoration: none;
      color: var(--text);
      white-space: nowrap;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    .search-container {
      flex: 1;
      max-width: 500px;
      display: flex;
      align-items: center;
      background: var(--tertiary-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 8px 16px;
      gap: 12px;
    }

    .search-container input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-container input::placeholder {
      color: var(--secondary-text);
    }

    .search-btn {
      background: none;
      border: none;
      color: var(--secondary-text);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: fit-content;
    }

    .nav-toggle {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-toggle:hover {
      background: var(--hover);
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: var(--secondary-bg);
      border-right: 1px solid var(--border);
      padding-top: 64px;
      overflow-y: auto;
      z-index: 99;
      transition: transform 0.2s;
    }

    .sidebar.hidden {
      transform: translateX(-100%);
    }

    .sidebar-section {
      padding: 12px 0;
    }

    .sidebar-section-title {
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--secondary-text);
      letter-spacing: 0.5px;
    }

    .sidebar-item {
      padding: 12px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 14px;
      color: var(--secondary-text);
      transition: 0.2s;
      border: 2px solid transparent;
    }

    .sidebar-item:hover {
      background: var(--hover);
      color: var(--text);
    }

    .sidebar-item.active {
      color: var(--accent);
      border-right-color: var(--accent);
    }

    .sidebar-item-icon {
      font-size: 24px;
      width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main {
      margin-left: 240px;
      margin-top: 64px;
      padding: 24px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .video-card {
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      opacity: 0.8;
    }

    .video-thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .video-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .video-info {
      display: flex;
      gap: 12px;
      padding-top: 12px;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--tertiary-bg);
      flex-shrink: 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary-text);
    }

    .video-details {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      font-size: 12px;
      color: var(--secondary-text);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .video-meta span:not(:last-child)::after {
      content: " •";
      margin-left: 4px;
    }

    .shorts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .short-card {
      position: relative;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
    }

    .short-card:hover {
      opacity: 0.8;
    }

    .short-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .short-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      padding: 16px 12px 12px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .short-icon {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .watch-container {
      max-width: 100%;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    .watch-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .watch-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .watch-info {
      margin-top: 16px;
    }

    .watch-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .watch-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--secondary-text);
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .watch-channel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .watch-channel-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--tertiary-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--secondary-text);
    }

    .watch-related {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .watch-related-item {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 8px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .watch-related-item:hover {
      background: var(--hover);
    }

    .watch-related-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .watch-related-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .watch-related-info {
      font-size: 12px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .watch-related-title {
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .watch-related-channel {
      color: var(--secondary-text);
    }

    @media (max-width: 1200px) {
      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    @media (max-width: 900px) {
      .sidebar {
        width: 200px;
      }

      .main {
        margin-left: 200px;
      }

      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }

      .watch-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 8px 12px;
      }

      .search-container {
        max-width: none;
      }

      .sidebar {
        width: 100%;
        transform: translateX(-100%);
      }

      .sidebar.visible {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 12px;
      }

      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }

      .video-title {
        font-size: 12px;
      }

      .video-meta {
        font-size: 11px;
      }

      .shorts-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="#" class="logo">
        <div class="logo-icon">▶</div>
        <span>Tuber</span>
      </a>
    </div>

    <div class="search-container">
      <input type="text" placeholder="Search" id="searchInput" />
      <button class="search-btn">🔍</button>
    </div>

    <div class="header-right">
      <button class="nav-toggle" id="sidebarToggle">☰</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-item active" data-view="home">
        <div class="sidebar-item-icon">🏠</div>
        <span>Home</span>
      </div>
      <div class="sidebar-item" data-view="shorts">
        <div class="sidebar-item-icon">⚡</div>
        <span>Shorts</span>
      </div>
      <div class="sidebar-item" data-view="subscriptions">
        <div class="sidebar-item-icon">📺</div>
        <span>Subscriptions</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">You</div>
      <div class="sidebar-item" data-view="history">
        <div class="sidebar-item-icon">⏱️</div>
        <span>History</span>
      </div>
      <div class="sidebar-item" data-view="library">
        <div class="sidebar-item-icon">📚</div>
        <span>Library</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">Explore</div>
      <div class="sidebar-item" data-view="trending">
        <div class="sidebar-item-icon">🔥</div>
        <span>Trending</span>
      </div>
      <div class="sidebar-item" data-view="music">
        <div class="sidebar-item-icon">🎵</div>
        <span>Music</span>
      </div>
      <div class="sidebar-item" data-view="gaming">
        <div class="sidebar-item-icon">🎮</div>
        <span>Gaming</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="view active" id="home">
      <h2 style="margin-bottom: 24px; font-size: 28px;">Recommended</h2>
      <div class="video-grid" id="videoGrid"></div>
    </div>

    <div class="view" id="shorts">
      <h2 style="margin-bottom: 24px; font-size: 28px;">Shorts</h2>
      <div class="shorts-grid" id="shortsGrid"></div>
    </div>

    <div class="view" id="subscriptions">
      <h2 style="margin-bottom: 24px; font-size: 28px;">Latest from your subscriptions</h2>
      <div class="video-grid" id="subscriptionGrid"></div>
    </div>

    <div class="view" id="trending">
      <h2 style="margin-bottom: 24px; font-size: 28px;">Trending</h2>
      <div class="video-grid" id="trendingGrid"></div>
    </div>

    <div class="view" id="history">
      <h2 style="margin-bottom: 24px; font-size: 28px;">Watch history</h2>
      <div class="video-grid" id="historyGrid"></div>
    </div>

    <div class="view" id="library">
      <h2 style="margin-bottom: 24px; font-size: 28px;">Liked videos</h2>
      <div class="video-grid" id="libraryGrid"></div>
    </div>

    <div class="view" id="music">
      <h2 style="margin-bottom: 24px; font-size: 28px;">Music</h2>
      <div class="video-grid" id="musicGrid"></div>
    </div>

    <div class="view" id="gaming">
      <h2 style="margin-bottom: 24px; font-size: 28px;">Gaming</h2>
      <div class="video-grid" id="gamingGrid"></div>
    </div>

    <div class="view" id="watch">
      <div class="watch-container">
        <div>
          <div class="watch-player">
            <iframe id="watchPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="watch-info">
            <h1 class="watch-title" id="watchTitle">Video Title</h1>
            <div class="watch-meta">
              <span id="watchMeta">1.2M views • 2 days ago</span>
            </div>
            <div class="watch-channel">
              <div class="watch-channel-avatar" id="watchAvatar">C</div>
              <div>
                <div style="font-weight: 600;" id="watchChannel">Channel Name</div>
                <div style="color: var(--secondary-text); font-size: 12px;">1.2M subscribers</div>
              </div>
            </div>
          </div>
        </div>
        <div class="watch-related" id="watchRelated"></div>
      </div>
    </div>
  </main>

  <script>
    const videos = [
      { id: "ScMzIvxBSi4", title: "Big Cat Videos & Nature", channel: "WildLife Studio", views: "12M", date: "2 days ago", duration: "4:12", thumb: "https://img.youtube.com/vi/ScMzIvxBSi4/hqdefault.jpg" },
      { id: "ysz5S6PUM-U", title: "Top 10 Places To Visit Before You Die", channel: "Travel Lens", views: "6.5M", date: "1 week ago", duration: "8:27", thumb: "https://img.youtube.com/vi/ysz5S6PUM-U/hqdefault.jpg" },
      { id: "M7lc1UVf-VE", title: "Build a Website in 30 Minutes", channel: "Code With Me", views: "1.2M", date: "3 days ago", duration: "16:40", thumb: "https://img.youtube.com/vi/M7lc1UVf-VE/hqdefault.jpg" },
      { id: "aqz-KE-bpKQ", title: "The Most Beautiful Forest Walk", channel: "Explore More", views: "7.8M", date: "5 days ago", duration: "11:02", thumb: "https://img.youtube.com/vi/aqz-KE-bpKQ/hqdefault.jpg" },
      { id: "dQw4w9WgXcQ", title: "Epic Summer Road Trip Vlog", channel: "Adventure Daily", views: "3.1M", date: "4 days ago", duration: "14:18", thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
      { id: "L_jWHff9VtM", title: "Top Tech Gadgets of 2026", channel: "Gadget Review", views: "9.3M", date: "1 month ago", duration: "9:05", thumb: "https://img.youtube.com/vi/L_jWHff9VtM/hqdefault.jpg" },
      { id: "e-ORhEE9VVg", title: "Morning Workout Routine", channel: "Fit Life", views: "2.7M", date: "6 days ago", duration: "5:43", thumb: "https://img.youtube.com/vi/e-ORhEE9VVg/hqdefault.jpg" },
      { id: "fJ9rUzIMcZQ", title: "How to Cook Fast Healthy Meals", channel: "Kitchen Daily", views: "1.9M", date: "2 weeks ago", duration: "7:11", thumb: "https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg" },
      { id: "jNQXAC9IVRw", title: "Me at the zoo", channel: "Jawed", views: "100M", date: "2 years ago", duration: "0:18", thumb: "https://img.youtube.com/vi/jNQXAC9IVRw/hqdefault.jpg" },
      { id: "9bZkp7q19f0", title: "PSY - GANGNAM STYLE", channel: "officialpsy", views: "3.2B", date: "11 years ago", duration: "3:54", thumb: "https://img.youtube.com/vi/9bZkp7q19f0/hqdefault.jpg" }
    ];

    const shorts = [
      { id: "ScMzIvxBSi4", title: "Amazing cat moments", thumb: "https://img.youtube.com/vi/ScMzIvxBSi4/hqdefault.jpg" },
      { id: "ysz5S6PUM-U", title: "Travel tips", thumb: "https://img.youtube.com/vi/ysz5S6PUM-U/hqdefault.jpg" },
      { id: "M7lc1UVf-VE", title: "Code tips", thumb: "https://img.youtube.com/vi/M7lc1UVf-VE/hqdefault.jpg" },
      { id: "aqz-KE-bpKQ", title: "Nature views", thumb: "https://img.youtube.com/vi/aqz-KE-bpKQ/hqdefault.jpg" },
      { id: "dQw4w9WgXcQ", title: "Road trip highlights", thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
      { id: "L_jWHff9VtM", title: "Tech unboxing", thumb: "https://img.youtube.com/vi/L_jWHff9VtM/hqdefault.jpg" }
    ];

    function createVideoCard(video) {
      return `
        <a href="#" class="video-card" onclick="watchVideo('${video.id}'); return false;">
          <div class="video-thumbnail">
            <img src="${video.thumb}" alt="${video.title}" />
            <div class="video-duration">${video.duration}</div>
          </div>
          <div class="video-info">
            <div class="channel-avatar">${video.channel.charAt(0)}</div>
            <div class="video-details">
              <div class="video-title">${video.title}</div>
              <div class="video-meta">
                <span>${video.channel}</span>
                <span>${video.views} views</span>
                <span>${video.date}</span>
              </div>
            </div>
          </div>
        </a>
      `;
    }

    function createShortCard(short) {
      return `
        <a href="#" class="short-card" onclick="watchVideo('${short.id}'); return false;">
          <img src="${short.thumb}" alt="${short.title}" />
          <div class="short-icon">▶</div>
          <div class="short-info">${short.title}</div>
        </a>
      `;
    }

    function renderView(view, gridId, data) {
      const grid = document.getElementById(gridId);
      if (grid) {
        if (view === 'shorts') {
          grid.innerHTML = data.map(createShortCard).join('');
        } else {
          grid.innerHTML = data.map(createVideoCard).join('');
        }
      }
    }

    function showView(viewName) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const target = document.getElementById(viewName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.view === viewName) item.classList.add('active');
      });

      document.getElementById('sidebar').classList.remove('visible');

      switch (viewName) {
        case 'home':
          renderView('home', 'videoGrid', videos);
          break;
        case 'shorts':
          renderView('shorts', 'shortsGrid', shorts);
          break;
        case 'subscriptions':
          renderView('subscriptions', 'subscriptionGrid', videos.slice(0, 6));
          break;
        case 'trending':
          renderView('trending', 'trendingGrid', videos);
          break;
        case 'history':
          renderView('history', 'historyGrid', videos.slice().reverse());
          break;
        case 'library':
          renderView('library', 'libraryGrid', videos.slice(0, 8));
          break;
        case 'music':
          renderView('music', 'musicGrid', videos.filter((_, i) => i % 2 === 0));
          break;
        case 'gaming':
          renderView('gaming', 'gamingGrid', videos.filter((_, i) => i % 3 === 0));
          break;
      }
    }

    function watchVideo(videoId) {
      const video = videos.find(v => v.id === videoId);
      if (!video) return;

      document.getElementById('watchPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      document.getElementById('watchTitle').textContent = video.title;
      document.getElementById('watchChannel').textContent = video.channel;
      document.getElementById('watchAvatar').textContent = video.channel.charAt(0);
      document.getElementById('watchMeta').textContent = `${video.views} views • ${video.date}`;

      const related = videos.filter(v => v.id !== videoId);
      const relatedHTML = related.slice(0, 10).map(v => `
        <a href="#" class="watch-related-item" onclick="watchVideo('${v.id}'); return false;">
          <div class="watch-related-thumb">
            <img src="${v.thumb}" alt="${v.title}" />
          </div>
          <div class="watch-related-info">
            <div class="watch-related-title">${v.title}</div>
            <div class="watch-related-channel">${v.channel}</div>
            <div style="color: var(--secondary-text); font-size: 11px;">${v.views} views</div>
          </div>
        </a>
      `).join('');
      document.getElementById('watchRelated').innerHTML = relatedHTML;

      showView('watch');
    }

    document.querySelectorAll('.sidebar-item').forEach(item => {
      item.addEventListener('click', () => showView(item.dataset.view));
    });

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('visible');
    });

    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const term = e.target.value.toLowerCase();
        const filtered = videos.filter(v => v.title.toLowerCase().includes(term));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('home').classList.add('active');
        document.getElementById('videoGrid').innerHTML = filtered.map(createVideoCard).join('');
      }
    });

    renderView('home', 'videoGrid', videos);
  </script>
</body>
</html>
