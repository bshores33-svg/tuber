<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuber</title>
  <style>
    :root {
      --bg: #0f0f13;
      --panel: #17181d;
      --panel-2: #1f2129;
      --accent: #ff3f3f;
      --accent-2: #ff7a18;
      --text: #f3f5f7;
      --muted: #a8afbb;
      --border: rgba(255,255,255,0.07);
      --shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: rgba(15,15,19,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    .search-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 22px;
    }

    .search {
      width: min(600px, 100%);
      display: flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .search input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 14px 18px;
      font-size: 1rem;
      outline: none;
    }

    .search button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      color: white;
      font-weight: 700;
      padding: 0 22px;
      cursor: pointer;
    }

    .content {
      display: grid;
      grid-template-columns: 1.9fr 0.9fr;
      gap: 18px;
      padding: 18px 24px 28px;
      flex: 1;
    }

    .main-pane {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .video-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .video-shell iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    .video-info {
      padding-top: 16px;
    }

    .video-title {
      font-size: clamp(1.4rem, 2vw, 2rem);
      font-weight: 700;
      margin: 0 0 10px;
      line-height: 1.3;
    }

    .meta {
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      font-size: 0.95rem;
    }

    .side-pane {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
      height: fit-content;
    }

    .side-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 6px 4px 12px;
      border-bottom: 1px solid var(--border);
    }

    .side-header h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
      padding-right: 6px;
    }

    .feed::-webkit-scrollbar {
      width: 8px;
    }

    .feed::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
    }

    .video-card {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: 0.2s ease;
      background: rgba(255,255,255,0.02);
    }

    .video-card:hover {
      border-color: var(--border);
      background: rgba(255,255,255,0.04);
      transform: translateY(-1px);
    }

    .video-card.active {
      border-color: rgba(255,122,24,0.6);
      background: rgba(255,122,24,0.08);
    }

    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .duration {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(0,0,0,0.75);
      color: white;
      font-size: 0.72rem;
      padding: 4px 6px;
      border-radius: 6px;
      font-weight: 700;
    }

    .card-info {
      min-width: 0;
    }

    .card-title {
      margin: 0 0 6px;
      font-size: 0.98rem;
      line-height: 1.35;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 980px) {
      .content {
        grid-template-columns: 1fr;
      }

      .feed {
        max-height: none;
      }

      .topbar {
        flex-wrap: wrap;
        gap: 12px;
      }

      .brand {
        width: 100%;
        justify-content: center;
      }

      .search-wrap {
        width: 100%;
        padding: 0;
      }
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 16px 14px;
      }

      .content {
        padding: 12px 12px 20px;
      }

      .video-card {
        grid-template-columns: 120px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <span>Tuber</span>
      </div>

      <div class="search-wrap">
        <div class="search">
          <input id="searchInput" type="text" placeholder="Search videos..." />
          <button id="searchBtn">Search</button>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="main-pane">
        <div class="video-shell">
          <iframe
            id="videoFrame"
            src="https://www.youtube.com/embed/ScMzIvxBSi4?autoplay=0"
            title="Main video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <div class="video-info">
          <h1 id="videoTitle" class="video-title">Big Cat Videos & Nature</h1>
          <div class="meta">
            <span id="videoViews">12M views</span>
            <span id="videoDate">2 days ago</span>
            <span id="videoChannel">WildLife Studio</span>
          </div>
        </div>
      </section>

      <aside class="side-pane">
        <div class="side-header">
          <h3>Recommended</h3>
        </div>

        <div id="videoFeed" class="feed"></div>
      </aside>
    </main>
  </div>

  <script>
    const videos = [
      {
        id: "ScMzIvxBSi4",
        title: "Big Cat Videos & Nature",
        channel: "WildLife Studio",
        views: "12M views",
        date: "2 days ago",
        duration: "4:12",
        thumb: "https://img.youtube.com/vi/ScMzIvxBSi4/hqdefault.jpg"
      },
      {
        id: "ysz5S6PUM-U",
        title: "Top 10 Places To Visit Before You Die",
        channel: "Travel Lens",
        views: "6.5M views",
        date: "1 week ago",
        duration: "8:27",
        thumb: "https://img.youtube.com/vi/ysz5S6PUM-U/hqdefault.jpg"
      },
      {
        id: "M7lc1UVf-VE",
        title: "Build a Website in 30 Minutes",
        channel: "Code With Me",
        views: "1.2M views",
        date: "3 days ago",
        duration: "16:40",
        thumb: "https://img.youtube.com/vi/M7lc1UVf-VE/hqdefault.jpg"
      },
      {
        id: "aqz-KE-bpKQ",
        title: "The Most Beautiful Forest Walk",
        channel: "Explore More",
        views: "7.8M views",
        date: "5 days ago",
        duration: "11:02",
        thumb: "https://img.youtube.com/vi/aqz-KE-bpKQ/hqdefault.jpg"
      },
      {
        id: "dQw4w9WgXcQ",
        title: "Epic Summer Road Trip Vlog",
        channel: "Adventure Daily",
        views: "3.1M views",
        date: "4 days ago",
        duration: "14:18",
        thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg"
      },
      {
        id: "L_jWHff9VtM",
        title: "Top Tech Gadgets of 2026",
        channel: "Gadget Review",
        views: "9.3M views",
        date: "1 month ago",
        duration: "9:05",
        thumb: "https://img.youtube.com/vi/L_jWHff9VtM/hqdefault.jpg"
      },
      {
        id: "e-ORhEE9VVg",
        title: "Morning Workout Routine",
        channel: "Fit Life",
        views: "2.7M views",
        date: "6 days ago",
        duration: "5:43",
        thumb: "https://img.youtube.com/vi/e-ORhEE9VVg/hqdefault.jpg"
      },
      {
        id: "fJ9rUzIMcZQ",
        title: "How to Cook Fast Healthy Meals",
        channel: "Kitchen Daily",
        views: "1.9M views",
        date: "2 weeks ago",
        duration: "7:11",
        thumb: "https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg"
      }
    ];

    const videoFrame = document.getElementById("videoFrame");
    const videoTitle = document.getElementById("videoTitle");
    const videoViews = document.getElementById("videoViews");
    const videoDate = document.getElementById("videoDate");
    const videoChannel = document.getElementById("videoChannel");
    const sidebar = document.getElementById("videoFeed");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");

    function renderVideos(list) {
      sidebar.innerHTML = "";

      list.forEach((video) => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.setAttribute("data-id", video.id);

        card.innerHTML = `
          <div class="thumb">
            <img src="${video.thumb}" alt="${video.title}" />
            <div class="duration">${video.duration}</div>
          </div>
          <div class="card-info">
            <p class="card-title">${video.title}</p>
            <div class="card-meta">
              <span>${video.channel}</span>
              <span>${video.views}</span>
              <span>${video.date}</span>
            </div>
          </div>
        `;

        card.addEventListener("click", () => {
          setActiveVideo(video.id);
        });

        sidebar.appendChild(card);
      });

      const activeCard = document.querySelector(`.video-card[data-id="${videoFrame.dataset.videoId || videos[0].id}"]`);
      if (activeCard) activeCard.classList.add("active");
    }

    function setActiveVideo(id) {
      const selected = videos.find(v => v.id === id);
      if (!selected) return;

      videoFrame.src = `https://www.youtube.com/embed/${selected.id}?autoplay=0`;
      videoFrame.dataset.videoId = selected.id;

      videoTitle.textContent = selected.title;
      videoViews.textContent = selected.views;
      videoDate.textContent = selected.date;
      videoChannel.textContent = selected.channel;

      document.querySelectorAll(".video-card").forEach((card) => {
        card.classList.toggle("active", card.dataset.id === id);
      });
    }

    function filterVideos() {
      const term = searchInput.value.trim().toLowerCase();
      const filtered = videos.filter((video) =>
        video.title.toLowerCase().includes(term) ||
        video.channel.toLowerCase().includes(term)
      );
      renderVideos(filtered);
      if (filtered.length > 0) {
        setActiveVideo(filtered[0].id);
      }
    }

    searchBtn.addEventListener("click", filterVideos);
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") filterVideos();
    });

    renderVideos(videos);
    setActiveVideo(videos[0].id);
  </script>
</body>
</html>
